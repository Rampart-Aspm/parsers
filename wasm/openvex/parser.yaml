apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterParser
metadata:
  name: openvex
spec:
  category: vex
  runtime: wasm
  description: OpenVEX triage statements and exploitability assertions parser
  detect:
    filenames:
    - '*openvex*.json'
    - '*.vex.json'
    probes:
    - jsonHasKeys:
      - '@context'
      - statements
  source:
    oci: ghcr.io/rampart-aspm/parsers/openvex:1.0.0
  limits:
    maxMemoryMB: 256
    timeoutSeconds: 60
